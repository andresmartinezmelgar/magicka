# Linux: usa la red del host para recibir broadcast LAN sin NAT del contenedor.
# Se ejecuta de forma independiente: docker compose -f compose.lan.yaml up -d --build
services:
  server:
    build: .
    image: arcana-arena-server:0.12.7
    network_mode: host
    restart: unless-stopped
    environment:
      SERVER_NAME: "${SERVER_NAME:-Arcana LAN}"
      GAME_PORT: "${GAME_PORT:-27015}"
      DISCOVERY_PORT: "${DISCOVERY_PORT:-27016}"
      GAME_MODE: "${GAME_MODE:-warfare}"
      ARENA_MAP: "${ARENA_MAP:-Classic}"
      MAX_PLAYERS: "${MAX_PLAYERS:-8}"
      BOTS: "${BOTS:-0}"
      FRIENDLY_FIRE: "${FRIENDLY_FIRE:-true}"
      SCORE_LIMIT: "${SCORE_LIMIT:-15}"
      TICKETS: "${TICKETS:-75}"
      SERVER_PASSWORD: "${SERVER_PASSWORD:-}"
      ARCANA_LOG_LEVEL: "${ARCANA_LOG_LEVEL:-Information}"
    volumes:
      - server-logs:/app/logs
    stop_grace_period: 10s
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
volumes:
  server-logs:
