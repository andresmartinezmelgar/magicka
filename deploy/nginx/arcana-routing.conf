# Incluir en el bloque http de nginx. El updater escribe únicamente el contenido del mapa.
map $http_x_arcana_version $arcana_backend {
    include /var/lib/arcana-server-updater/upstream.conf;
}
map $http_upgrade $arcana_connection {
    default upgrade;
    '' close;
}
# En el servidor HTTPS existente, usar las directivas de arcana-locations.conf.
