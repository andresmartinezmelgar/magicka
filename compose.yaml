services:
  server:
    build: .
    image: arcana-arena-server:local
    restart: unless-stopped
    ports:
      - "${GAME_PORT:-27015}:${GAME_PORT:-27015}/tcp"
      - "${DISCOVERY_PORT:-27016}:${DISCOVERY_PORT:-27016}/udp"
    environment:
      SERVER_NAME: "${SERVER_NAME:-Arcana Arena}"
      GAME_PORT: "${GAME_PORT:-27015}"
      DISCOVERY_PORT: "${DISCOVERY_PORT:-27016}"
      GAME_MODE: "${GAME_MODE:-warfare}"
      ARENA_MAP: "${ARENA_MAP:-Classic}"
      MAX_PLAYERS: "${MAX_PLAYERS:-}"
      BOTS: "${BOTS:-0}"
      FRIENDLY_FIRE: "${FRIENDLY_FIRE:-true}"
      SCORE_LIMIT: "${SCORE_LIMIT:-15}"
      TICKETS: "${TICKETS:-75}"
      SERVER_PASSWORD: "${SERVER_PASSWORD:-}"
      ARCANA_REWARD_OUTBOX: /app/data/rewards
      ARCANA_MATCH_STATISTICS_DIR: /app/data/statistics
      ARCANA_STATISTICS_CLEANUP_ENABLED: "${ARCANA_STATISTICS_CLEANUP_ENABLED:-false}"
      ARCANA_DEPLOYMENT_KEY: "${ARCANA_DEPLOYMENT_KEY:-}"
      ARCANA_TRUSTED_PROXY_IP: "${ARCANA_TRUSTED_PROXY_IP:-}"
      ARCANA_LOG_LEVEL: "${ARCANA_LOG_LEVEL:-Information}"
      ARCANA_PLAY_NO_ADS_PRODUCT_ID: "${ARCANA_PLAY_NO_ADS_PRODUCT_ID:-}"
      ARCANA_PLAY_SHOP_ENABLED: "${ARCANA_PLAY_SHOP_ENABLED:-false}"
      ARCANA_ADMOB_ENABLED: "${ARCANA_ADMOB_ENABLED:-false}"
      ARCANA_ADMOB_APP_ID: "${ARCANA_ADMOB_APP_ID:-}"
      ARCANA_ADMOB_REWARDED_UNIT_ID: "${ARCANA_ADMOB_REWARDED_UNIT_ID:-}"
    volumes:
      - server-logs:/app/logs
      - server-data:/app/data
    stop_grace_period: 30s
    mem_limit: "${ARCANA_MEMORY_LIMIT:-768m}"
    cpus: "${ARCANA_CPU_LIMIT:-2.0}"
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
volumes:
  server-logs:
  server-data:
