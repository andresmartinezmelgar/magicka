name: Arcana Arena - compilacion automatica

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# CI comprueba exclusivamente lo reproducible sin dispositivos, red LAN ni credenciales
# privadas. Las pruebas manuales estan documentadas en docs/PRUEBAS-MANUALES-v0.17.md.
jobs:
  build:
    name: Compilar codigo C# y validar version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Validar metadatos de version
        run: python3 scripts/version-support.py check .
      - name: Compilar cliente, servidor y pruebas
        run: dotnet build ArcanaArena.sln -c Release --nologo
      - name: Compilar servidor de cuentas heredado
        run: dotnet build src/Arcana.AccountServer/Arcana.AccountServer.csproj -c Release --nologo

  package-windows:
    name: Generar distribucion Windows
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Descargar Godot .NET
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'godot'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          Invoke-WebRequest https://github.com/godotengine/godot/releases/download/4.5.2-stable/Godot_v4.5.2-stable_mono_win64.zip -OutFile "$root/editor.zip"
          Expand-Archive "$root/editor.zip" "$root/editor"
          Invoke-WebRequest https://github.com/godotengine/godot/releases/download/4.5.2-stable/Godot_v4.5.2-stable_mono_export_templates.tpz -OutFile "$root/templates.zip"
          $archive = [System.IO.Compression.ZipFile]::OpenRead("$root/templates.zip")
          try {
            $entry = $archive.Entries | Where-Object { $_.Name -eq 'version.txt' } | Select-Object -First 1
            $reader = [System.IO.StreamReader]::new($entry.Open())
            try { $version = $reader.ReadToEnd().Trim() } finally { $reader.Dispose() }
            $target = Join-Path $env:APPDATA "Godot/export_templates/$version"
            New-Item -ItemType Directory -Path $target -Force | Out-Null
            foreach ($entry in $archive.Entries | Where-Object { $_.Name -match '^windows_.*x86_64' -or $_.Name -eq 'version.txt' }) {
              [System.IO.Compression.ZipFileExtensions]::ExtractToFile($entry, (Join-Path $target $entry.Name), $true)
            }
          } finally { $archive.Dispose() }
          $editor = Get-ChildItem "$root/editor" -Recurse -Filter '*win64_console.exe' | Select-Object -First 1
          if (!$editor) { throw 'No se encuentra Godot .NET.' }
          "ARCANA_GODOT=$($editor.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Compilar juego y servidor con el script del proyecto
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./scripts/auto-compile.ps1 -GodotPath $env:ARCANA_GODOT
          if ($LASTEXITCODE -ne 0) { throw 'Error al generar Windows.' }
          if (!(Test-Path Juego/ArcanaArena.exe) -or !(Test-Path Juego/server/Arcana.Server.exe)) { throw 'Distribucion incompleta.' }
      - name: Empaquetar Windows
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          Compress-Archive -Path Juego/* -DestinationPath "artifacts/ArcanaArena-v$version-Windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ArcanaArena-Windows-x64
          path: artifacts/ArcanaArena-*-Windows-x64.zip
          retention-days: 14

  package-android:
    name: Generar APK Android sin emulador
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Preparar Android SDK
        run: |
          sdk="$RUNNER_TEMP/android-sdk"
          mkdir -p "$sdk/cmdline-tools"
          curl -fL https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip -o "$RUNNER_TEMP/android-cli.zip"
          unzip -q "$RUNNER_TEMP/android-cli.zip" -d "$sdk/cmdline-tools"
          mv "$sdk/cmdline-tools/cmdline-tools" "$sdk/cmdline-tools/latest"
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk" --licenses >/dev/null || true
          "$sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk" 'platform-tools' 'build-tools;35.0.0' 'platforms;android-35'
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
      - name: Preparar Godot y plantillas
        run: |
          curl -fL https://github.com/godotengine/godot/releases/download/4.5.2-stable/Godot_v4.5.2-stable_mono_linux_x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.5.2-stable_mono_linux_x86_64/Godot_v4.5.2-stable_mono_linux.x86_64
          curl -fL https://github.com/godotengine/godot/releases/download/4.5.2-stable/Godot_v4.5.2-stable_mono_export_templates.tpz -o /tmp/templates.tpz
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          with zipfile.ZipFile('/tmp/templates.tpz') as z:
              version=z.read('templates/version.txt').decode().strip()
              target=Path.home()/'.local/share/godot/export_templates'/version
              target.mkdir(parents=True,exist_ok=True)
              for name in ('android_debug.apk','android_release.apk','android_source.zip','version.txt'):
                  (target/name).write_bytes(z.read('templates/'+name))
          PY
          echo "ARCANA_GODOT=/tmp/godot/Godot_v4.5.2-stable_mono_linux_x86_64/Godot_v4.5.2-stable_mono_linux.x86_64" >> "$GITHUB_ENV"
      - name: Compilar plugin nativo Firebase para Android
        run: |
          gradle -p android/firebase-plugin :plugin:assembleRelease --no-daemon
          mkdir -p src/Arcana.Client/addons/arcana_firebase
          cp android/firebase-plugin/plugin/build/outputs/aar/plugin-release.aar src/Arcana.Client/addons/arcana_firebase/ArcanaFirebase.aar
          test -s src/Arcana.Client/addons/arcana_firebase/ArcanaFirebase.aar
      - name: Compilar cliente e importar recursos
        run: |
          dotnet build src/Arcana.Client/Arcana.Client.csproj -c Debug --nologo
          "$ARCANA_GODOT" --headless --editor --path src/Arcana.Client --import
      - name: Generar APK ARM64
        run: bash scripts/package-android.sh "$ARCANA_GODOT"
      - uses: actions/upload-artifact@v4
        with:
          name: ArcanaArena-Android-arm64
          path: |
            artifacts/android/*-Android-arm64.apk
            artifacts/android/SHA256SUMS-Android.txt
          retention-days: 14

  release-on-tag:
    name: Publicar artefactos al crear un tag
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, package-windows, package-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar version del tag
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '\r\n' < VERSION)
          test "$GITHUB_REF_NAME" = "v$version" || { echo "::error::El tag no coincide con VERSION ($version)."; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          name: ArcanaArena-Windows-x64
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: ArcanaArena-Android-arm64
          path: dist
      - name: Validar artefactos y generar hashes
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '\r\n' < VERSION)
          test -s "dist/ArcanaArena-v$version-Windows-x64.zip"
          test -s "dist/ArcanaArena-v$version-Android-arm64.apk"
          cd dist
          sha256sum "ArcanaArena-v$version-Windows-x64.zip" "ArcanaArena-v$version-Android-arm64.apk" > SHA256SUMS.txt
      - name: Instalar herramientas de firma Android
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq apksigner
      - name: Firmar APK con clave permanente y verificarla
        env:
          ARCANA_KEYSTORE_BASE64: ${{ secrets.ARCANA_KEYSTORE_BASE64 }}
          ARCANA_KEYSTORE_PASSWORD: ${{ secrets.ARCANA_KEYSTORE_PASSWORD }}
          ARCANA_KEY_ALIAS: ${{ secrets.ARCANA_KEY_ALIAS }}
          ARCANA_KEY_PASSWORD: ${{ secrets.ARCANA_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for key in ARCANA_KEYSTORE_BASE64 ARCANA_KEYSTORE_PASSWORD ARCANA_KEY_ALIAS ARCANA_KEY_PASSWORD; do
            if [ -z "${!key}" ]; then
              echo "::error::Falta el secreto $key; no se publicara ninguna APK con firma temporal."
              exit 1
            fi
          done
          version=$(tr -d '\r\n' < VERSION)
          apk="dist/ArcanaArena-v$version-Android-arm64.apk"
          printf '%s' "$ARCANA_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/arcana-release.jks"
          chmod 600 "$RUNNER_TEMP/arcana-release.jks"
          printf '%s' "$ARCANA_KEYSTORE_PASSWORD" > "$RUNNER_TEMP/storepass"
          printf '%s' "$ARCANA_KEY_PASSWORD" > "$RUNNER_TEMP/keypass"
          chmod 600 "$RUNNER_TEMP/storepass" "$RUNNER_TEMP/keypass"
          apksigner sign --ks "$RUNNER_TEMP/arcana-release.jks" --ks-key-alias "$ARCANA_KEY_ALIAS" --ks-pass "file:$RUNNER_TEMP/storepass" --key-pass "file:$RUNNER_TEMP/keypass" "$apk"
          apksigner verify --verbose --print-certs "$apk"
          (cd dist && sha256sum "ArcanaArena-v$version-Windows-x64.zip" "ArcanaArena-v$version-Android-arm64.apk" > SHA256SUMS.txt)
          rm -f "$RUNNER_TEMP/arcana-release.jks" "$RUNNER_TEMP/storepass" "$RUNNER_TEMP/keypass"
      - name: Crear Release de GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.zip dist/*.apk dist/SHA256SUMS.txt --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.apk dist/SHA256SUMS.txt \
              --title "Arcana Arena $GITHUB_REF_NAME" \
              --notes "Compilacion automatica desde tag. Validacion funcional en dispositivos a cargo del usuario." \
              --verify-tag
          fi
