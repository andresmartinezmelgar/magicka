name: Arcana Arena - compilacion automatica

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Godot solicita net8.0 con LatestMajor por defecto. En los runners con .NET 10
# eso cambia el runtime de las pruebas. Los cierres fallidos usaban .NET 10.
# Conserva los parches de seguridad de 8.0 sin cambiar de versión principal.
env:
  DOTNET_ROLL_FORWARD: LatestPatch

# CI comprueba exclusivamente lo reproducible sin dispositivos, red LAN ni credenciales
# privadas. Las pruebas manuales estan documentadas en docs/PRUEBAS-MANUALES-v0.17.md.
jobs:
  build:
    name: Compilar codigo C# y validar version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Validar metadatos de version
        run: python3 scripts/version-support.py check .
      - name: Verificar aislamiento e integridad de publicaciones de prueba
        run: |
          python3 scripts/test-preview-release.py
          python3 scripts/test-delta-publisher.py
      - name: Compilar cliente, servidor y pruebas
        run: dotnet build ArcanaArena.sln -c Release --nologo
      - name: Ejecutar pruebas funcionales y regresiones del motor
        run: dotnet run --project tests/Arcana.Tests/Arcana.Tests.csproj -c Release --no-build
      - name: Medir horda de Defensa con cuatro jugadores y 192 minions
        run: dotnet run --project tests/Arcana.Tests/Arcana.Tests.csproj -c Release --no-build -- --defense-benchmark
      - name: Medir inicio de Defensa, tiempos de combate y supervivencia con uno a cuatro defensores
        run: dotnet run --project tests/Arcana.Tests/Arcana.Tests.csproj -c Release --no-build -- --defense-balance
      - name: Verificar generador Python y reconstruccion APK en el cliente C#
        run: |
          python3 scripts/test-update-deltas.py --fixtures artifacts/delta-tests
          dotnet run --project tests/Arcana.Tests/Arcana.Tests.csproj -c Release --no-build -- --delta-fixtures=artifacts/delta-tests
      - name: Probar servidor LAN real, creación de salas e invitados sin atajos de CI
        run: bash scripts/test-network.sh
      - name: Probar sala vacía, equipos y comienzo manual de serie PvP
        run: bash scripts/test-series-lobby.sh
      - name: Validar reglas de verificación de identidad sin conexión externa
        run: dotnet run --project tests/Arcana.Account.Tests/Arcana.Account.Tests.csproj -c Release --no-build -- --verified-claims-only
      - name: Verificar premios pendientes con Firebase y servidor caídos
        run: dotnet run --project tests/Arcana.Account.Tests/Arcana.Account.Tests.csproj -c Release --no-build -- --reward-outbox-only
      - name: Compilar servidor de cuentas heredado
        run: dotnet build src/Arcana.AccountServer/Arcana.AccountServer.csproj -c Release --nologo

  docker-server:
    name: Servidor Docker (${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Compilar y comprobar servidor y volumen persistente
        env:
          ARCANA_DOCKER_ARCH: ${{ matrix.arch }}
        run: bash scripts/test-docker-server.sh

  firestore-rules:
    name: Validar reglas Firestore con emulador
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar Firebase CLI y bibliotecas de pruebas
        run: npm install --prefix tests/firebase-rules --no-audit --no-fund
      - name: Compilar pruebas de cuentas y transacciones contra emulador
        run: dotnet build tests/Arcana.Account.Tests/Arcana.Account.Tests.csproj -c Release --nologo
      - name: Probar reglas de Firestore sin credenciales reales
        run: tests/firebase-rules/node_modules/.bin/firebase emulators:exec --only firestore --project demo-arcana-arena --config firebase.json -- 'node tests/firebase-rules/verify.cjs'
      - name: Validar integración de cuentas, sala PvP y recompensas (obligatorio)
        run: tests/firebase-rules/node_modules/.bin/firebase emulators:exec --only firestore --project demo-arcana-arena --config firebase.json -- 'dotnet run --project tests/Arcana.Account.Tests/Arcana.Account.Tests.csproj -c Release --no-build'

  visual-audit:
    name: Simulaciones visuales reales con Xvfb
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Preparar Godot .NET y recursos gráficos
        run: |
          set -euo pipefail
          curl --retry 4 --retry-delay 2 -fL https://github.com/godotengine/godot/releases/download/4.5.2-stable/Godot_v4.5.2-stable_mono_linux_x86_64.zip -o "$RUNNER_TEMP/godot-visual.zip"
          unzip -q "$RUNNER_TEMP/godot-visual.zip" -d "$RUNNER_TEMP/godot-visual"
          GODOT="$RUNNER_TEMP/godot-visual/Godot_v4.5.2-stable_mono_linux_x86_64/Godot_v4.5.2-stable_mono_linux.x86_64"
          chmod +x "$GODOT"
          echo "ARCANA_GODOT=$GODOT" >> "$GITHUB_ENV"
          dotnet build src/Arcana.Client/Arcana.Client.csproj -c Debug --nologo
          dotnet build src/Arcana.Server/Arcana.Server.csproj -c Debug --nologo
          "$GODOT" --headless --editor --path src/Arcana.Client --import
      - name: Verificar retratos del bestiario, reliquias y guardado local en escritorio y móvil
        run: |
          set -euo pipefail
          for viewport in 1280x720 720x540; do
            "$ARCANA_GODOT" --headless --audio-driver Dummy --path src/Arcana.Client -- --bestiary-smoke "--smoke-viewport=$viewport" 2>&1 | tee "$RUNNER_TEMP/bestiary-$viewport.log"
            grep -q 'BESTIARY_RELICS_SMOKE_OK' "$RUNNER_TEMP/bestiary-$viewport.log"
            ! grep -E '^(ERROR:|SCRIPT ERROR:)|SMOKE_FAILED' "$RUNNER_TEMP/bestiary-$viewport.log"
            "$ARCANA_GODOT" --headless --audio-driver Dummy --path src/Arcana.Client -- --survival-save-smoke "--smoke-viewport=$viewport" 2>&1 | tee "$RUNNER_TEMP/survival-save-$viewport.log"
            grep -q 'SURVIVAL_SAVE_SMOKE_OK' "$RUNNER_TEMP/survival-save-$viewport.log"
            ! grep -E '^(ERROR:|SCRIPT ERROR:)|SMOKE_FAILED' "$RUNNER_TEMP/survival-save-$viewport.log"
          done
          "$ARCANA_GODOT" --headless --audio-driver Dummy --path src/Arcana.Client -- --mobile --bestiary-smoke --smoke-viewport=720x540 2>&1 | tee "$RUNNER_TEMP/bestiary-mobile.log"
          grep -q 'BESTIARY_RELICS_SMOKE_OK' "$RUNNER_TEMP/bestiary-mobile.log"
          ! grep -E '^(ERROR:|SCRIPT ERROR:)|SMOKE_FAILED' "$RUNNER_TEMP/bestiary-mobile.log"
          "$ARCANA_GODOT" --headless --audio-driver Dummy --path src/Arcana.Client -- --mobile --survival-save-smoke --smoke-viewport=720x540 2>&1 | tee "$RUNNER_TEMP/survival-save-mobile.log"
          grep -q 'SURVIVAL_SAVE_SMOKE_OK' "$RUNNER_TEMP/survival-save-mobile.log"
          ! grep -E '^(ERROR:|SCRIPT ERROR:)|SMOKE_FAILED' "$RUNNER_TEMP/survival-save-mobile.log"
      - name: Renderizar capturas de móvil y escritorio y validar los límites
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          for viewport in 1440x900 1024x640 720x540; do
            target="$PWD/artifacts/visual-review/$viewport"
            mkdir -p "$target"
            xvfb-run -a -s "-screen 0 1920x1080x24" "$ARCANA_GODOT" --audio-driver Dummy --path src/Arcana.Client --               --mobile-menu-smoke "--smoke-viewport=$viewport" --visual-review "--visual-directory=$target"               2>&1 | tee "$RUNNER_TEMP/visual-$viewport.log"
            grep -q 'MOBILE_MENU_LAYOUT_OK' "$RUNNER_TEMP/visual-$viewport.log"
            grep -q 'SIMPLE_COMBINATIONS_OK' "$RUNNER_TEMP/visual-$viewport.log"
            grep -q 'MOBILE_SERIES_REWARD_LAYOUT_OK' "$RUNNER_TEMP/visual-$viewport.log"
            grep -q 'MOBILE_SERIES_LOSS_LAYOUT_OK' "$RUNNER_TEMP/visual-$viewport.log"
            grep -q 'VISUAL_CAPTURE_OK:02-victoria-3-de-5' "$RUNNER_TEMP/visual-$viewport.log"
            grep -q 'VISUAL_CAPTURE_OK:02-derrota-3-de-5' "$RUNNER_TEMP/visual-$viewport.log"
            ! grep -E '^(ERROR:|SCRIPT ERROR:)|SMOKE_FAILED|LAYOUT_FAILED' "$RUNNER_TEMP/visual-$viewport.log"
          done
          for viewport in 1440x900 1024x720; do
            target="$PWD/artifacts/visual-review/desktop-$viewport"
            mkdir -p "$target"
            xvfb-run -a -s "-screen 0 1920x1080x24" "$ARCANA_GODOT" --audio-driver Dummy --path src/Arcana.Client -- --visual-desktop "--smoke-viewport=$viewport" --preview-shield=stone "--capture=$target/11-hud-escritorio.png" 2>&1 | tee "$RUNNER_TEMP/desktop-render-$viewport.log"
            grep -q 'CAPTURE:' "$RUNNER_TEMP/desktop-render-$viewport.log"
            test -s "$target/11-hud-escritorio.png"
          done
          for surface in desktop mobile; do
            viewport=1440x900
            args=(--visual-desktop)
            if [ "$surface" = mobile ]; then viewport=1024x640; args=(--mobile); fi
            target="$PWD/artifacts/visual-review/stone-$surface"
            mkdir -p "$target"
            for scene in stone stone-close stone-auras; do
              xvfb-run -a -s "-screen 0 1920x1080x24" "$ARCANA_GODOT" --audio-driver Dummy --path src/Arcana.Client -- "${args[@]}" "--smoke-viewport=$viewport" "--preview-spells=$scene" "--capture=$target/$scene.png" 2>&1 | tee "$RUNNER_TEMP/$scene-$surface.log"
              grep -q 'CAPTURE: Ok' "$RUNNER_TEMP/$scene-$surface.log"
              ! grep -E '^(ERROR:|SCRIPT ERROR:)|SMOKE_FAILED' "$RUNNER_TEMP/$scene-$surface.log"
            done
          done
          python3 - <<'PY'
          import glob, struct, pathlib, hashlib
          files = sorted(glob.glob('artifacts/visual-review/*/*.png'))
          if len(files) != 47:
              raise SystemExit(f'Faltan capturas: {len(files)}/47')
          for name in files:
              raw = pathlib.Path(name).read_bytes()
              if len(raw) < 12000 or raw[:8] != b'\x89PNG\r\n\x1a\n':
                  raise SystemExit(f'PNG vacío o inválido: {name}: {len(raw)} bytes')
              w, h = struct.unpack('>II', raw[16:24])
              if (w, h) not in ((1440, 900), (1024, 640), (720, 540), (1024, 720)):
                  raise SystemExit(f'Tamaño inesperado {w}x{h}: {name}')
          unique = len({hashlib.sha256(pathlib.Path(p).read_bytes()).digest() for p in files})
          if unique < 38: raise SystemExit(f'Escenas indistinguibles: {unique}/44')
          print(f'VISUAL_QA_OK: 44 PNG válidos, {unique} fotogramas distintos, 5 escenarios de tamaño y auras de piedra en móvil/escritorio.')
          PY
      - name: Comprobar bonificaciones activas, persistencia y consulta de otros magos
        run: |
          set -euo pipefail
          bash scripts/test-client-smoke.sh equipment-smoke "$ARCANA_GODOT"
          bash scripts/test-client-smoke.sh shop-smoke "$ARCANA_GODOT"
          bash scripts/test-client-smoke.sh sale-smoke "$ARCANA_GODOT"
          bash scripts/test-client-smoke.sh equipment-elements-smoke "$ARCANA_GODOT"
          bash scripts/test-client-smoke.sh equipment-public-smoke "$ARCANA_GODOT"
      - name: Verificar y capturar tienda permanente en escritorio y móvil
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          for surface in desktop mobile; do
            args=(--visual-desktop --smoke-viewport=1440x900)
            if [ "$surface" = mobile ]; then args=(--mobile --smoke-viewport=720x540); fi
            target="$PWD/artifacts/visual-review/shop-$surface"
            mkdir -p "$target"
            xvfb-run -a -s "-screen 0 1920x1080x24" "$ARCANA_GODOT" --audio-driver Dummy --path src/Arcana.Client -- --shop-smoke "${args[@]}" "--shop-captures=$target" 2>&1 | tee "$RUNNER_TEMP/shop-$surface.log"
            grep -q 'SHOP_SMOKE_OK' "$RUNNER_TEMP/shop-$surface.log"
            test "$(find "$target" -name '*.png' | wc -l)" -eq 6
            ! grep -E '^(ERROR:|SCRIPT ERROR:)|SMOKE_FAILED' "$RUNNER_TEMP/shop-$surface.log"
          done
      - name: Verificar y capturar la venta en escritorio y pantallas móviles pequeñas
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          for surface in desktop mobile small; do
            args=(--visual-desktop --smoke-viewport=1440x900)
            if [ "$surface" = mobile ]; then args=(--mobile --smoke-viewport=720x540); fi
            if [ "$surface" = small ]; then args=(--mobile --smoke-viewport=640x450); fi
            target="$PWD/artifacts/visual-review/sale-$surface"
            export XDG_DATA_HOME="$RUNNER_TEMP/sale-cache-$surface"
            timeout 50s xvfb-run -a -s "-screen 0 1920x1080x24" "$ARCANA_GODOT" --audio-driver Dummy --path src/Arcana.Client -- --sale-smoke "${args[@]}" "--sale-captures=$target" 2>&1 | tee "$RUNNER_TEMP/sale-$surface.log"
            grep -q 'SALE_SMOKE_OK' "$RUNNER_TEMP/sale-$surface.log"
            test "$(find "$target" -name '*.png' | wc -l)" -eq 2
            ! grep -E '^(ERROR:|SCRIPT ERROR:)|SMOKE_FAILED' "$RUNNER_TEMP/sale-$surface.log"
            timeout 50s xvfb-run -a -s "-screen 0 1920x1080x24" "$ARCANA_GODOT" --audio-driver Dummy --path src/Arcana.Client -- --sale-smoke --quick-item-actions "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/quick-sale-$surface.log"
            grep -q 'QUICK_SALE_OK' "$RUNNER_TEMP/quick-sale-$surface.log"
            grep -q 'QUICK_CANCEL_OK' "$RUNNER_TEMP/quick-sale-$surface.log"
            grep -q 'SALE_SMOKE_OK' "$RUNNER_TEMP/quick-sale-$surface.log"
            ! grep -E '^(ERROR:|SCRIPT ERROR:)|SMOKE_FAILED' "$RUNNER_TEMP/quick-sale-$surface.log"
          done
      - name: Verificar favoritos, equipos, ventas múltiples y editor táctil
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          for surface in desktop mobile small; do
            args=(--visual-desktop --smoke-viewport=1440x900)
            if [ "$surface" = mobile ]; then args=(--mobile --smoke-viewport=720x540); fi
            if [ "$surface" = small ]; then args=(--mobile --smoke-viewport=640x450); fi
            target="$PWD/artifacts/visual-review/usability-$surface"
            export XDG_DATA_HOME="$RUNNER_TEMP/usability-cache-$surface"
            timeout 50s xvfb-run -a -s "-screen 0 1920x1080x24" "$ARCANA_GODOT" --audio-driver Dummy --path src/Arcana.Client -- --usability-smoke "${args[@]}" "--usability-captures=$target" 2>&1 | tee "$RUNNER_TEMP/usability-$surface.log"
            grep -q 'USABILITY_SMOKE_OK' "$RUNNER_TEMP/usability-$surface.log"
            test "$(find "$target" -name '*.png' | wc -l)" -eq 3
            ! grep -E '^(ERROR:|SCRIPT ERROR:)|SMOKE_FAILED' "$RUNNER_TEMP/usability-$surface.log"
          done
      - name: Verificar Defensa en escritorio y móvil y capturar tienda, inventario y botín
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          for viewport in 1440x720 1024x640 720x540; do
            target="$PWD/artifacts/visual-review/defense-$viewport"
            mkdir -p "$target"
            xvfb-run -a -s "-screen 0 1920x1080x24" "$ARCANA_GODOT" --audio-driver Dummy --path src/Arcana.Client -- --defense-smoke --quick-item-actions --mobile "--smoke-viewport=$viewport" "--defense-captures=$target" 2>&1 | tee "$RUNNER_TEMP/defense-$viewport.log"
            grep -q 'QUICK_UPGRADE_OK' "$RUNNER_TEMP/defense-$viewport.log"
            grep -q 'SURVIVAL_SECTORS_OK' "$RUNNER_TEMP/defense-$viewport.log"
            grep -q 'DEFENSE_SMOKE_OK' "$RUNNER_TEMP/defense-$viewport.log"
            ! grep -E '^(ERROR:|SCRIPT ERROR:)|DEFENSE_SMOKE_FAILED' "$RUNNER_TEMP/defense-$viewport.log"
          done
          target="$PWD/artifacts/visual-review/defense-desktop"
          mkdir -p "$target"
          xvfb-run -a -s "-screen 0 1920x1080x24" "$ARCANA_GODOT" --audio-driver Dummy --path src/Arcana.Client -- --defense-smoke --quick-item-actions --smoke-viewport=1440x900 "--defense-captures=$target" 2>&1 | tee "$RUNNER_TEMP/defense-desktop.log"
          grep -q 'QUICK_UPGRADE_OK' "$RUNNER_TEMP/defense-desktop.log"
          grep -q 'DEFENSE_SMOKE_OK' "$RUNNER_TEMP/defense-desktop.log"
          ! grep -E '^(ERROR:|SCRIPT ERROR:)|DEFENSE_SMOKE_FAILED' "$RUNNER_TEMP/defense-desktop.log"
      - name: Verificar marcadores de hielo y rocas en escritorio y móvil
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          for surface in desktop mobile; do
            args=()
            if [ "$surface" = mobile ]; then args=(--mobile --smoke-viewport=720x540); fi
            target="$PWD/artifacts/visual-review/aim-markers-$surface"
            timeout 60s xvfb-run -a -s "-screen 0 1920x1080x24" "$ARCANA_GODOT" --audio-driver Dummy --path src/Arcana.Client -- --aim-marker-smoke "${args[@]}" "--aim-marker-directory=$target" 2>&1 | tee "$RUNNER_TEMP/aim-markers-$surface.log"
            grep -q 'AIM_MARKER_SMOKE_OK' "$RUNNER_TEMP/aim-markers-$surface.log"
            ! grep -E '^(ERROR:|SCRIPT ERROR:)|AIM_MARKER_SMOKE_FAILED' "$RUNNER_TEMP/aim-markers-$surface.log"
            test -s "$target/hielo.png"
            test -s "$target/roca.png"
          done
      - name: Revisar áreas, auras y pasivas en escritorio y móvil
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          for surface in desktop mobile; do
            args=(--smoke-viewport=1440x900)
            if [ "$surface" = mobile ]; then args=(--mobile --smoke-viewport=720x540); fi
            target="$PWD/artifacts/visual-review/areas-$surface"
            mkdir -p "$target"
            for scene in areas auras passives; do
              timeout 90s xvfb-run -a -s "-screen 0 1920x1080x24" "$ARCANA_GODOT" --audio-driver Dummy --path src/Arcana.Client -- "${args[@]}" "--preview-spells=$scene" "--capture=$target/$scene.png" 2>&1 | tee "$RUNNER_TEMP/$scene-$surface.log"
              grep -q 'CAPTURE: Ok' "$RUNNER_TEMP/$scene-$surface.log"
              ! grep -E '^(ERROR:|SCRIPT ERROR:)|SMOKE_FAILED' "$RUNNER_TEMP/$scene-$surface.log"
              test -s "$target/$scene.png"
            done
          done
          python3 - <<'PY'
          from pathlib import Path
          import struct
          for surface, size in [('desktop', (1440, 900)), ('mobile', (720, 540))]:
              for scene in ['areas', 'auras', 'passives']:
                  path = Path('artifacts/visual-review') / ('areas-' + surface) / (scene + '.png')
                  data = path.read_bytes()
                  assert data[:8] == b'\x89PNG\r\n\x1a\n', path
                  actual = struct.unpack('>II', data[16:24])
                  assert actual == size, (path, actual, size)
          PY
      - name: Verificar reconexión desde la interfaz móvil
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          GAME_PORT=29115 DISCOVERY_PORT=29116 BOTS=0 SERVER_PASSWORD= dotnet src/Arcana.Server/bin/Debug/net8.0/Arcana.Server.dll > "$RUNNER_TEMP/reconnect-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in {1..80}; do
            if curl -fsS http://127.0.0.1:29115/health >/dev/null; then break; fi
            sleep 0.2
          done
          timeout 150s xvfb-run -a -s "-screen 0 1280x720x24" "$ARCANA_GODOT" --audio-driver Dummy --path src/Arcana.Client -- --reconnect-smoke --reconnect-server=127.0.0.1:29115 --mobile --smoke-viewport=1024x640 2>&1 | tee "$RUNNER_TEMP/reconnect-client.log"
          grep -q 'RECONNECT_SMOKE_OK' "$RUNNER_TEMP/reconnect-client.log"
          ! grep -E '^(ERROR:|SCRIPT ERROR:)|RECONNECT_SMOKE_FAILED' "$RUNNER_TEMP/reconnect-client.log"
      - name: Medir Supervivencia con combate, IA, inventario y portales
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          mkdir -p artifacts/visual-review/survival-performance
          xvfb-run -a -s "-screen 0 1280x720x24" "$ARCANA_GODOT" --audio-driver Dummy --path src/Arcana.Client -- --profile-render --profile-survival --profile-warmup=2 --profile-seconds=10 --profile-output="$PWD/artifacts/visual-review/survival-performance/report.json" 2>&1 | tee "$RUNNER_TEMP/survival-profile.log"
          grep -q 'PROFILE_OK' "$RUNNER_TEMP/survival-profile.log"
          python3 scripts/check-survival-profile.py artifacts/visual-review/survival-performance/report.json
      - name: Regresiones de sesión, OAuth, navegación y PvP adaptable
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          for surface in desktop mobile; do
            args=()
            if [ "$surface" = mobile ]; then args=(--mobile); fi
            target="$PWD/artifacts/visual-review/regressions/$surface"
            export XDG_DATA_HOME="$RUNNER_TEMP/regression-cache-$surface"
            timeout 90s xvfb-run -a -s "-screen 0 1920x1080x24" "$ARCANA_GODOT" --audio-driver Dummy --path src/Arcana.Client -- --regression-smoke "${args[@]}" "--regression-captures=$target" 2>&1 | tee "$RUNNER_TEMP/regressions-$surface.log"
            grep -q 'REGRESSION_SMOKE_OK' "$RUNNER_TEMP/regressions-$surface.log"
            grep -q 'TOUCH_REJECTED_CAST_REGRESSION_OK' "$RUNNER_TEMP/regressions-$surface.log"
            test "$(find "$target" -name '*.png' | wc -l)" -eq 12
            ! grep -E '^(ERROR:|SCRIPT ERROR:)|REGRESSION_SMOKE_FAILED' "$RUNNER_TEMP/regressions-$surface.log"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ArcanaArena-Capturas-QA
          path: artifacts/visual-review/
          if-no-files-found: warn
          retention-days: 14

  package-windows:
    name: Generar distribucion Windows
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Descargar Godot .NET
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'godot'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          Invoke-WebRequest https://github.com/godotengine/godot/releases/download/4.5.2-stable/Godot_v4.5.2-stable_mono_win64.zip -OutFile "$root/editor.zip"
          Expand-Archive "$root/editor.zip" "$root/editor"
          Invoke-WebRequest https://github.com/godotengine/godot/releases/download/4.5.2-stable/Godot_v4.5.2-stable_mono_export_templates.tpz -OutFile "$root/templates.zip"
          $archive = [System.IO.Compression.ZipFile]::OpenRead("$root/templates.zip")
          try {
            $entry = $archive.Entries | Where-Object { $_.Name -eq 'version.txt' } | Select-Object -First 1
            $reader = [System.IO.StreamReader]::new($entry.Open())
            try { $version = $reader.ReadToEnd().Trim() } finally { $reader.Dispose() }
            $target = Join-Path $env:APPDATA "Godot/export_templates/$version"
            New-Item -ItemType Directory -Path $target -Force | Out-Null
            foreach ($entry in $archive.Entries | Where-Object { $_.Name -match '^windows_.*x86_64' -or $_.Name -eq 'version.txt' }) {
              [System.IO.Compression.ZipFileExtensions]::ExtractToFile($entry, (Join-Path $target $entry.Name), $true)
            }
          } finally { $archive.Dispose() }
          $editor = Get-ChildItem "$root/editor" -Recurse -Filter '*win64_console.exe' | Select-Object -First 1
          if (!$editor) { throw 'No se encuentra Godot .NET.' }
          "ARCANA_GODOT=$($editor.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Compilar juego y servidor con el script del proyecto
        shell: pwsh
        env:
          ARCANA_GOOGLE_DESKTOP_OAUTH_BASE64: ${{ secrets.ARCANA_GOOGLE_DESKTOP_OAUTH_BASE64 }}
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./scripts/auto-compile.ps1 -GodotPath $env:ARCANA_GODOT
          if ($LASTEXITCODE -ne 0) { throw 'Error al generar Windows.' }
          if (!(Test-Path Juego/ArcanaArena.exe) -or !(Test-Path Juego/server/Arcana.Server.exe)) { throw 'Distribucion incompleta.' }
      - name: Verificar cifrado DPAPI de la sesion Google en Windows
        shell: pwsh
        run: dotnet run --project tests/Arcana.Tests/Arcana.Tests.csproj -c Release -- --desktop-session-only
      - name: Probar instalacion automatica y recuperacion real en Windows
        shell: pwsh
        run: |
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/test-windows-update.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Fallo la regresion del actualizador Windows.' }
      - name: Probar instalacion diferencial, eliminaciones y alternativa completa
        shell: pwsh
        run: |
          python scripts/test-update-deltas.py --fixtures artifacts/delta-tests
          if ($LASTEXITCODE -ne 0) { throw 'Fallo la generacion de parches de prueba.' }
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/test-delta-install.ps1 -FixtureDirectory artifacts/delta-tests
          if ($LASTEXITCODE -ne 0) { throw 'Fallo la instalacion diferencial Windows.' }
      - name: Empaquetar Windows
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          Compress-Archive -Path Juego/* -DestinationPath "artifacts/ArcanaArena-v$version-Windows-x64.zip"
      - name: Comprobar OAuth en la distribucion Windows
        shell: pwsh
        env:
          ARCANA_GOOGLE_DESKTOP_OAUTH_BASE64: ${{ secrets.ARCANA_GOOGLE_DESKTOP_OAUTH_BASE64 }}
        run: |
          $configured = -not [string]::IsNullOrWhiteSpace($env:ARCANA_GOOGLE_DESKTOP_OAUTH_BASE64)
          $version = (Get-Content VERSION -Raw).Trim()
          Add-Type -AssemblyName System.IO.Compression.ZipFile
          $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path "artifacts/ArcanaArena-v$version-Windows-x64.zip"))
          try {
            $included = @($zip.Entries | Where-Object { $_.FullName -eq 'google-desktop-oauth.json' }).Count -eq 1
            if ($configured -and !$included) { throw 'Falta google-desktop-oauth.json dentro del ZIP final.' }
            if (!$configured) { Write-Host '::warning::Falta configurar ARCANA_GOOGLE_DESKTOP_OAUTH_BASE64 para incluir OAuth en Windows.' }
            if ($included) { Write-Host 'WINDOWS_GOOGLE_OAUTH_PACKAGED_OK' }
          } finally { $zip.Dispose() }
      - name: Generar parches Windows contra distribuciones publicadas
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $deltaOptions = @()
          if ($env:GITHUB_REF -like 'refs/heads/*' -and $env:GITHUB_REF_NAME -ne 'main') {
            $deltaOptions = @('--preview-branch', $env:GITHUB_REF_NAME)
          }
          python scripts/generate-update-deltas.py --platform windows --target "artifacts/ArcanaArena-v$version-Windows-x64.zip" --version $version --output artifacts --repository "${{ github.repository }}" @deltaOptions
          if ($LASTEXITCODE -ne 0) { throw 'Fallo la generacion diferencial Windows.' }
      - uses: actions/upload-artifact@v4
        with:
          name: ArcanaArena-Windows-x64
          path: |
            artifacts/ArcanaArena-*-Windows-x64*.zip
            artifacts/SHA256SUMS-Windows.txt
            artifacts/DELTAS-Windows-x64.json
          retention-days: 14

  package-android:
    name: Generar APK Android sin emulador
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Preparar Android SDK
        run: |
          sdk="$RUNNER_TEMP/android-sdk"
          mkdir -p "$sdk/cmdline-tools"
          curl --retry 5 --retry-delay 3 --retry-all-errors --http1.1 -fL https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip -o "$RUNNER_TEMP/android-cli.zip"
          unzip -q "$RUNNER_TEMP/android-cli.zip" -d "$sdk/cmdline-tools"
          mv "$sdk/cmdline-tools/cmdline-tools" "$sdk/cmdline-tools/latest"
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk" --licenses >/dev/null || true
          "$sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk" 'platform-tools' 'build-tools;35.0.0' 'platforms;android-35'
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
      - name: Preparar Godot y plantillas
        run: |
          curl --retry 4 --retry-delay 2 --retry-all-errors -fL https://github.com/godotengine/godot/releases/download/4.5.2-stable/Godot_v4.5.2-stable_mono_linux_x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.5.2-stable_mono_linux_x86_64/Godot_v4.5.2-stable_mono_linux.x86_64
          curl --retry 4 --retry-delay 2 --retry-all-errors -fL https://github.com/godotengine/godot/releases/download/4.5.2-stable/Godot_v4.5.2-stable_mono_export_templates.tpz -o /tmp/templates.tpz
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          with zipfile.ZipFile('/tmp/templates.tpz') as z:
              version=z.read('templates/version.txt').decode().strip()
              target=Path.home()/'.local/share/godot/export_templates'/version
              target.mkdir(parents=True,exist_ok=True)
              for name in ('android_debug.apk','android_release.apk','android_source.zip','version.txt'):
                  (target/name).write_bytes(z.read('templates/'+name))
          PY
          echo "ARCANA_GODOT=/tmp/godot/Godot_v4.5.2-stable_mono_linux_x86_64/Godot_v4.5.2-stable_mono_linux.x86_64" >> "$GITHUB_ENV"
      - name: Compilar plugin nativo Firebase para Android
        run: |
          gradle -p android/firebase-plugin :plugin:assembleRelease --no-daemon
          mkdir -p src/Arcana.Client/addons/arcana_firebase
          cp android/firebase-plugin/plugin/build/outputs/aar/plugin-release.aar src/Arcana.Client/addons/arcana_firebase/ArcanaFirebase.aar
          test -s src/Arcana.Client/addons/arcana_firebase/ArcanaFirebase.aar
      - name: Compilar cliente e importar recursos
        run: |
          dotnet build src/Arcana.Client/Arcana.Client.csproj -c Debug --nologo
          "$ARCANA_GODOT" --headless --editor --path src/Arcana.Client --import
      - name: Verificar cabecera de perfil y tarjetas 2x2 en escritorio (geometría real)
        run: |
          set -o pipefail
          for viewport in 1600x900 1440x900 1280x720 1024x720; do
            "$ARCANA_GODOT" --headless --path src/Arcana.Client -- --desktop-header-smoke "--smoke-viewport=$viewport" 2>&1 | tee "$RUNNER_TEMP/desktop-header-$viewport.log"
            grep -q 'DESKTOP_HEADER_LAYOUT_OK' "$RUNNER_TEMP/desktop-header-$viewport.log"
            ! grep -E '^(ERROR:|SCRIPT ERROR:)|SMOKE_FAILED|DESKTOP_HEADER_LAYOUT_FAILED' "$RUNNER_TEMP/desktop-header-$viewport.log"
          done
      - name: Verificar visibilidad de botones PvP y versus IA en modo móvil
        run: |
          set -o pipefail
          "$ARCANA_GODOT" --headless --path src/Arcana.Client -- --mobile-menu-smoke 2>&1 | tee "$RUNNER_TEMP/mobile-menu-smoke.log"
          grep -q 'MOBILE_MENU_LAYOUT_OK' "$RUNNER_TEMP/mobile-menu-smoke.log"
          for viewport in 1024x640 800x600 720x540 640x450; do
            "$ARCANA_GODOT" --headless --path src/Arcana.Client -- --mobile-menu-smoke "--smoke-viewport=$viewport" 2>&1 | tee "$RUNNER_TEMP/mobile-menu-$viewport.log"
            grep -q 'MOBILE_MENU_LAYOUT_OK' "$RUNNER_TEMP/mobile-menu-$viewport.log"
            ! grep -E '^(ERROR:|SCRIPT ERROR:)|SMOKE_FAILED' "$RUNNER_TEMP/mobile-menu-$viewport.log"
          done
      - name: Verificar márgenes táctiles y minimapa en los siete mapas
        run: |
          set -euo pipefail
          for viewport in 1440x720 1024x640 720x540 640x450; do
            export XDG_DATA_HOME="$RUNNER_TEMP/touch-layout-$viewport"
            timeout 90s "$ARCANA_GODOT" --headless --audio-driver Dummy --path src/Arcana.Client -- --touch-layout-smoke --mobile "--smoke-viewport=$viewport" 2>&1 | tee "$RUNNER_TEMP/touch-layout-$viewport.log"
            grep -q 'TOUCH_LAYOUT_SMOKE_OK' "$RUNNER_TEMP/touch-layout-$viewport.log"
            ! grep -E '^(ERROR:|SCRIPT ERROR:)|SMOKE_FAILED' "$RUNNER_TEMP/touch-layout-$viewport.log"
          done
      - name: Verificar ventana de actualización y botones en pantalla
        run: |
          set -o pipefail
          "$ARCANA_GODOT" --headless --path src/Arcana.Client -- --update-ui-smoke 2>&1 | tee "$RUNNER_TEMP/update-ui-desktop.log"
          grep -q 'UPDATE_NOTICE_LAYOUT_OK' "$RUNNER_TEMP/update-ui-desktop.log"
          "$ARCANA_GODOT" --headless --path src/Arcana.Client -- --mobile --update-ui-smoke 2>&1 | tee "$RUNNER_TEMP/update-ui-mobile.log"
          grep -q 'UPDATE_NOTICE_LAYOUT_OK' "$RUNNER_TEMP/update-ui-mobile.log"
      - name: Verificar en simulación táctil el apuntado de hielo y escudos
        run: |
          set -o pipefail
          timeout 160s "$ARCANA_GODOT" --headless --audio-driver Dummy --path src/Arcana.Client -- --mobile-smoke 2>&1 | tee "$RUNNER_TEMP/mobile-spell-smoke.log"
          grep -q 'MOBILE_ICE_AIM_OK' "$RUNNER_TEMP/mobile-spell-smoke.log"
          grep -q 'MOBILE_SMOKE_OK' "$RUNNER_TEMP/mobile-spell-smoke.log"
          ! grep -E '^(ERROR:|SCRIPT ERROR:)|SMOKE_FAILED' "$RUNNER_TEMP/mobile-spell-smoke.log"
      - name: Simular HUD, mapas, efectos, magos, combinaciones y práctica
        run: |
          set -euo pipefail
          for mode in hud-smoke maps-smoke effects-smoke sprites-smoke combinations-smoke practice-smoke; do
            bash scripts/test-client-smoke.sh "$mode" "$ARCANA_GODOT"
          done
      - name: Generar APK ARM64
        run: bash scripts/package-android.sh "$ARCANA_GODOT"
      - name: Usar firma Android permanente cuando esta disponible (Google OAuth)
        shell: bash
        env:
          ARCANA_KEYSTORE_BASE64: ${{ secrets.ARCANA_KEYSTORE_BASE64 }}
          ARCANA_KEYSTORE_PASSWORD: ${{ secrets.ARCANA_KEYSTORE_PASSWORD }}
          ARCANA_KEY_ALIAS: ${{ secrets.ARCANA_KEY_ALIAS }}
          ARCANA_KEY_PASSWORD: ${{ secrets.ARCANA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          version=$(tr -d '\r\n' < VERSION)
          apk="artifacts/android/ArcanaArena-v$version-Android-arm64.apk"
          test -s "$apk"
          signer="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          status="TEMPORAL"
          if [[ -n "${ARCANA_KEYSTORE_BASE64:-}" && -n "${ARCANA_KEYSTORE_PASSWORD:-}" && -n "${ARCANA_KEY_ALIAS:-}" && -n "${ARCANA_KEY_PASSWORD:-}" ]]; then
            keystore="$RUNNER_TEMP/arcana-google-signin.jks"
            storepass="$RUNNER_TEMP/arcana-google-storepass"
            keypass="$RUNNER_TEMP/arcana-google-keypass"
            trap 'rm -f "$keystore" "$storepass" "$keypass" "$apk.signed"' EXIT
            printf '%s' "$ARCANA_KEYSTORE_BASE64" | base64 -d > "$keystore"
            printf '%s' "$ARCANA_KEYSTORE_PASSWORD" > "$storepass"
            printf '%s' "$ARCANA_KEY_PASSWORD" > "$keypass"
            chmod 600 "$keystore" "$storepass" "$keypass"
            "$signer" sign --ks "$keystore" --ks-key-alias "$ARCANA_KEY_ALIAS" --ks-pass "file:$storepass" --key-pass "file:$keypass" --out "$apk.signed" "$apk"
            "$signer" verify --verbose "$apk.signed"
            mv -f "$apk.signed" "$apk"
            status="PERMANENTE"
            echo 'APK firmada con el certificado estable para Google OAuth.'
          else
            echo '::warning::Esta APK usa certificado aleatorio nuevo. Google Login Android probablemente fallará hasta firmarla con el certificado registrado en Firebase.'
          fi
          fingerprint=$("$signer" verify --print-certs "$apk" | grep 'Signer #1 certificate SHA-1 digest:' | head -n1)
          printf 'Tipo de firma: %s\n%s\nPaquete: com.arcana.arena\nProyecto Firebase: arcana-arena-f2997\n' "$status" "$fingerprint" > artifacts/android/FIRMA-ANDROID.txt
          cat artifacts/android/FIRMA-ANDROID.txt
          (cd artifacts/android && sha256sum "ArcanaArena-v$version-Android-arm64.apk" > SHA256SUMS-Android.txt)
      - name: Verificar instalador y permisos dentro de la APK final
        run: |
          set -euo pipefail
          version=$(tr -d '\r\n' < VERSION)
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "artifacts/android/ArcanaArena-v$version-Android-arm64.apk" AndroidManifest.xml > "$RUNNER_TEMP/update-manifest.txt"
          for required in android.permission.REQUEST_INSTALL_PACKAGES android.permission.UPDATE_PACKAGES_WITHOUT_USER_ACTION org.godotengine.plugin.v2.ArcanaUpdates com.arcana.firebase.ArcanaUpdateResultActivity; do
            grep -Fq "$required" "$RUNNER_TEMP/update-manifest.txt"
          done
          echo ANDROID_UPDATE_INSTALLER_PACKAGED_OK
      - name: Generar y reconstruir parches de la APK firmada
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(tr -d '\r\n' < VERSION)
          delta_options=()
          if [[ "$GITHUB_REF" == refs/heads/* && "$GITHUB_REF_NAME" != main ]]; then
            delta_options=(--preview-branch "$GITHUB_REF_NAME")
          fi
          python3 scripts/generate-update-deltas.py --platform android --target "artifacts/android/ArcanaArena-v$version-Android-arm64.apk" --version "$version" --output artifacts/android --repository "${{ github.repository }}" "${delta_options[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: ArcanaArena-Android-arm64
          path: |
            artifacts/android/*-Android-arm64.apk
            artifacts/android/*-Android-arm64-from-v*.delta
            artifacts/android/SHA256SUMS-Android.txt
            artifacts/android/FIRMA-ANDROID.txt
            artifacts/android/DELTAS-Android-arm64.json
          retention-days: 14

  publish-android-first:
    name: Publicar APK Android firmada sin esperar a Windows
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, docker-server, firestore-rules, visual-audit, package-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ArcanaArena-Android-arm64
          path: dist
      - name: Instalar herramientas de firma Android
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq apksigner
      - name: Firmar Android con el certificado permanente y verificar
        env:
          ARCANA_KEYSTORE_BASE64: ${{ secrets.ARCANA_KEYSTORE_BASE64 }}
          ARCANA_KEYSTORE_PASSWORD: ${{ secrets.ARCANA_KEYSTORE_PASSWORD }}
          ARCANA_KEY_ALIAS: ${{ secrets.ARCANA_KEY_ALIAS }}
          ARCANA_KEY_PASSWORD: ${{ secrets.ARCANA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for key in ARCANA_KEYSTORE_BASE64 ARCANA_KEYSTORE_PASSWORD ARCANA_KEY_ALIAS ARCANA_KEY_PASSWORD; do
            test -n "${!key}" || { echo "::error::Falta la clave de firma: $key"; exit 1; }
          done
          version=$(tr -d '\r\n' < VERSION)
          apk="dist/ArcanaArena-v$version-Android-arm64.apk"
          test -s "$apk"
          printf '%s' "$ARCANA_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/arcana-release.jks"
          chmod 600 "$RUNNER_TEMP/arcana-release.jks"
          printf '%s' "$ARCANA_KEYSTORE_PASSWORD" > "$RUNNER_TEMP/storepass"
          printf '%s' "$ARCANA_KEY_PASSWORD" > "$RUNNER_TEMP/keypass"
          chmod 600 "$RUNNER_TEMP/storepass" "$RUNNER_TEMP/keypass"
          apksigner sign --ks "$RUNNER_TEMP/arcana-release.jks" --ks-key-alias "$ARCANA_KEY_ALIAS" --ks-pass "file:$RUNNER_TEMP/storepass" --key-pass "file:$RUNNER_TEMP/keypass" "$apk"
          apksigner verify --verbose --print-certs "$apk"
          (cd dist && sha256sum "ArcanaArena-v$version-Android-arm64.apk" > SHA256SUMS-Android.txt)
          rm -f "$RUNNER_TEMP/arcana-release.jks" "$RUNNER_TEMP/storepass" "$RUNNER_TEMP/keypass"
      - name: Generar parches despues de la firma final Android
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(tr -d '\r\n' < VERSION)
          python3 scripts/generate-update-deltas.py --platform android --target "dist/ArcanaArena-v$version-Android-arm64.apk" --version "$version" --output dist --repository "${{ github.repository }}"
      - name: Publicar APK firmada antes que Windows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(tr -d '\r\n' < VERSION)
          tag="v$version"
          apk="dist/ArcanaArena-v$version-Android-arm64.apk"
          python3 scripts/release_notes.py --output "$RUNNER_TEMP/release-notes.md"
          shopt -s nullglob
          assets=("$apk" dist/*-Android-arm64-from-v*.delta dist/SHA256SUMS-Android.txt)
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          elif ! gh release create "$tag" "${assets[@]}" --target "$GITHUB_SHA" \
              --title "Arcana Arena $tag" \
              --notes-file "$RUNNER_TEMP/release-notes.md"; then
            gh release upload "$tag" "${assets[@]}" --clobber
          fi
          gh release edit "$tag" --notes-file "$RUNNER_TEMP/release-notes.md"

  release-on-tag:
    name: Publicar artefactos al crear un tag
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: [build, docker-server, firestore-rules, visual-audit, package-windows, package-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar version del tag
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '\r\n' < VERSION)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "v$version" || { echo "::error::El tag no coincide con VERSION ($version)."; exit 1; }
          fi
      - uses: actions/download-artifact@v4
        with:
          name: ArcanaArena-Windows-x64
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: ArcanaArena-Android-arm64
          path: dist
      - name: Validar artefactos y generar hashes
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '\r\n' < VERSION)
          test -s "dist/ArcanaArena-v$version-Windows-x64.zip"
          test -s "dist/ArcanaArena-v$version-Android-arm64.apk"
          cd dist
          sha256sum "ArcanaArena-v$version-Windows-x64.zip" "ArcanaArena-v$version-Android-arm64.apk" > SHA256SUMS.txt
      - name: Instalar herramientas de firma Android
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq apksigner
      - name: Firmar APK con clave permanente y verificarla
        if: github.ref != 'refs/heads/main'
        env:
          ARCANA_KEYSTORE_BASE64: ${{ secrets.ARCANA_KEYSTORE_BASE64 }}
          ARCANA_KEYSTORE_PASSWORD: ${{ secrets.ARCANA_KEYSTORE_PASSWORD }}
          ARCANA_KEY_ALIAS: ${{ secrets.ARCANA_KEY_ALIAS }}
          ARCANA_KEY_PASSWORD: ${{ secrets.ARCANA_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for key in ARCANA_KEYSTORE_BASE64 ARCANA_KEYSTORE_PASSWORD ARCANA_KEY_ALIAS ARCANA_KEY_PASSWORD; do
            if [ -z "${!key}" ]; then
              echo "::error::Falta el secreto $key; no se publicara ninguna APK con firma temporal."
              exit 1
            fi
          done
          version=$(tr -d '\r\n' < VERSION)
          apk="dist/ArcanaArena-v$version-Android-arm64.apk"
          printf '%s' "$ARCANA_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/arcana-release.jks"
          chmod 600 "$RUNNER_TEMP/arcana-release.jks"
          printf '%s' "$ARCANA_KEYSTORE_PASSWORD" > "$RUNNER_TEMP/storepass"
          printf '%s' "$ARCANA_KEY_PASSWORD" > "$RUNNER_TEMP/keypass"
          chmod 600 "$RUNNER_TEMP/storepass" "$RUNNER_TEMP/keypass"
          apksigner sign --ks "$RUNNER_TEMP/arcana-release.jks" --ks-key-alias "$ARCANA_KEY_ALIAS" --ks-pass "file:$RUNNER_TEMP/storepass" --key-pass "file:$RUNNER_TEMP/keypass" "$apk"
          apksigner verify --verbose --print-certs "$apk"
          (cd dist && sha256sum "ArcanaArena-v$version-Windows-x64.zip" "ArcanaArena-v$version-Android-arm64.apk" > SHA256SUMS.txt)
          rm -f "$RUNNER_TEMP/arcana-release.jks" "$RUNNER_TEMP/storepass" "$RUNNER_TEMP/keypass"
      - name: Regenerar parches de tag tras firmar Android
        if: github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '\r\n' < VERSION)
          python3 scripts/generate-update-deltas.py --platform android --target "dist/ArcanaArena-v$version-Android-arm64.apk" --version "$version" --output dist --repository "${{ github.repository }}"
          cat dist/SHA256SUMS-Windows.txt dist/SHA256SUMS-Android.txt > dist/SHA256SUMS.txt
      - name: Crear Release de GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '\r\n' < VERSION)
          tag="v$version"
          python3 scripts/release_notes.py --output "$RUNNER_TEMP/release-notes.md"
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            # APK firmada: solo publish-android-first. Este job solo publica Windows.
            # Así no compiten dos trabajos por el mismo asset y nunca se borra la APK.
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" dist/*.zip dist/SHA256SUMS-Windows.txt --clobber
            elif ! gh release create "$tag" dist/*.zip dist/SHA256SUMS-Windows.txt \
                --target "$GITHUB_SHA" \
                --title "Arcana Arena $tag" \
                --notes-file "$RUNNER_TEMP/release-notes.md"; then
              # El trabajo Android puede haber creado la Release simultáneamente.
              sleep 3
              gh release view "$tag" >/dev/null
              gh release upload "$tag" dist/*.zip dist/SHA256SUMS-Windows.txt --clobber
            fi
          elif gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            shopt -s nullglob
            gh release upload "$GITHUB_REF_NAME" dist/*.zip dist/*.apk dist/*.delta dist/SHA256SUMS*.txt --clobber
          else
            shopt -s nullglob
            gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.apk dist/*.delta dist/SHA256SUMS*.txt \
              --title "Arcana Arena $GITHUB_REF_NAME" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --verify-tag
          fi
          gh release edit "$tag" --notes-file "$RUNNER_TEMP/release-notes.md"

  publish-preview:
    name: Publicar versiones de prueba de otras ramas
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main'
    needs: [build, docker-server, firestore-rules, visual-audit, package-windows, package-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ArcanaArena-Windows-x64
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: ArcanaArena-Android-arm64
          path: dist
      - name: Validar binarios firmados y preparar la publicación
        run: |
          python3 scripts/prepare-preview-release.py --root . --dist dist \
            --branch "$GITHUB_REF_NAME" --commit "$GITHUB_SHA" --build "$GITHUB_RUN_NUMBER" \
            --notes-file "$RUNNER_TEMP/preview-notes.md" --tag-file "$RUNNER_TEMP/preview-tag.txt"
      - name: Publicar preliminar sin modificar la última versión estable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(cat "$RUNNER_TEMP/preview-tag.txt")
          shopt -s nullglob
          assets=(dist/*-Windows-x64*.zip dist/*-Android-arm64.apk dist/*-Android-arm64-from-v*.delta dist/DELTAS-*.json dist/SHA256SUMS.txt dist/SHA256SUMS-Windows.txt dist/SHA256SUMS-Android.txt dist/PREVIEW.json)
          if gh release view "$tag" >/dev/null 2>&1; then
            target=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq '.target_commitish')
            test "$target" = "$GITHUB_SHA" || { echo '::error::La preliminar existente pertenece a otro commit.'; exit 1; }
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" --draft --prerelease --latest=false \
              --target "$GITHUB_SHA" --title "Arcana Arena PRUEBAS $tag" \
              --notes-file "$RUNNER_TEMP/preview-notes.md"
          fi
          for attempt in 1 2 3; do
            if gh release edit "$tag" --draft=false --prerelease --latest=false --notes-file "$RUNNER_TEMP/preview-notes.md"; then
              break
            fi
            test "$attempt" -lt 3 || exit 1
            sleep 3
          done


  cleanup-integrated-branches-0270:
    name: Limpiar ramas integradas de 0.27.0
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, docker-server, firestore-rules, visual-audit, package-windows, package-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Eliminar solo las ramas incluidas en esta integración
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.readFileSync('VERSION', 'utf8').trim() !== '0.27.0') return;
            const { owner, repo } = context.repo;
            const main = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
            if (main.data.commit.sha !== context.sha) {
              core.info('main ha avanzado; no se limpian ramas desde una revisión antigua.');
              return;
            }
            const branches = [{"name":"feature/escudos-estilo-b-ingame","sha":"b0a9d340a515770711005784b11a1bbbb78b39f6"},{"name":"feature/escudos-visuales-estilo-b","sha":"0ca7d328a967f53d2182ba2ccf920634df1f1dfb"},{"name":"feature/supervivencia-enemigos-escalado","sha":"ea0fb3011f2d687c53a6f6295de8412e6fbfd61f"},{"name":"feature/supervivencia-ia-hechizos-conos","sha":"c11c2a3f632e0761d1de4fcccdfaf63bf0e9fa01"},{"name":"codex/bestiario-afijos-reliquias","sha":null}];
            for (const branch of branches) {
              let current;
              try { current = await github.rest.repos.getBranch({ owner, repo, branch: branch.name }); }
              catch (error) { if (error.status === 404) continue; throw error; }
              if (branch.sha && current.data.commit.sha !== branch.sha) {
                core.setFailed('La rama ha avanzado y se conserva: ' + branch.name);
                continue;
              }
              const comparison = await github.rest.repos.compareCommits({
                owner, repo, base: current.data.commit.sha, head: context.sha
              });
              if (!['ahead', 'identical'].includes(comparison.data.status)) {
                core.setFailed('La rama contiene cambios sin integrar y se conserva: ' + branch.name);
                continue;
              }
              await github.rest.git.deleteRef({ owner, repo, ref: 'heads/' + branch.name });
              core.info('Rama integrada eliminada: ' + branch.name);
            }
