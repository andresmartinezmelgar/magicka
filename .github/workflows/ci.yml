name: Arcana Arena CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Compilar cliente, servidor, núcleo y pruebas
        run: dotnet build ArcanaArena.sln -c Release --nologo
      - name: Reglas y red real
        run: bash scripts/test-network.sh
      - name: Descargar Godot .NET de la versión fijada
        run: |
          curl -fL https://github.com/godotengine/godot/releases/download/4.5.2-stable/Godot_v4.5.2-stable_mono_linux_x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.5.2-stable_mono_linux_x86_64/Godot_v4.5.2-stable_mono_linux.x86_64
      - name: Compilar cliente para ejecución del editor
        run: dotnet build src/Arcana.Client/Arcana.Client.csproj -c Debug --nologo
      - name: Arrancar práctica Godot headless
        env:
          GODOT_SILENCE_ROOT_WARNING: 1
        run: |
          timeout 30s /tmp/godot/Godot_v4.5.2-stable_mono_linux_x86_64/Godot_v4.5.2-stable_mono_linux.x86_64 --headless --audio-driver Dummy --path src/Arcana.Client -- --smoke | tee godot-test.log
          grep -q SMOKE_OK godot-test.log
      - name: Construir y arrancar servidor Docker
        run: |
          docker build -t arcana-arena-server:test .
          docker run -d --name arcana-ci -p 27015:27015 -p 27016:27016/udp -e SERVER_PASSWORD=arcana-ci-test arcana-arena-server:test
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:27015/health; then break; fi
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:27015/health
      - name: Comprobar conexión IP contra Docker con puertos publicados
        env:
          TEST_PASSWORD: arcana-ci-test
        run: dotnet tests/Arcana.Tests/bin/Release/net8.0/Arcana.Tests.dll --only-network --skip-discovery --server=127.0.0.1:27015 --discovery-port=27016
      - name: Arrancar variante Docker para LAN Linux
        run: |
          docker rm -f arcana-ci
          docker run -d --name arcana-ci --network host -e SERVER_PASSWORD=arcana-ci-test arcana-arena-server:test
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:27015/health; then break; fi
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:27015/health
      - name: Comprobar IP y descubrimiento LAN contra Docker con red host
        env:
          TEST_PASSWORD: arcana-ci-test
        run: dotnet tests/Arcana.Tests/bin/Release/net8.0/Arcana.Tests.dll --only-network --server=127.0.0.1:27015 --discovery-port=27016
      - name: Publicar servidor compilado
        run: dotnet publish src/Arcana.Server -c Release --no-restore -o artifacts/server
      - uses: actions/upload-artifact@v4
        with:
          name: arcana-server-v0.1.0
          path: artifacts/server
      - name: Logs de diagnóstico
        if: failure()
        run: |
          cat server-test.log 2>/dev/null || true
          docker logs arcana-ci 2>/dev/null || true
      - name: Detener contenedor de prueba
        if: always()
        run: docker rm -f arcana-ci 2>/dev/null || true
