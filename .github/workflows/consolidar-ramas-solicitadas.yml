name: Consolidar las ramas solicitadas
on:
  push:
    branches: [main]
    paths: ['.github/workflows/consolidar-ramas-solicitadas.yml']
permissions:
  contents: write
jobs:
  limpiar:
    if: github.event.head_commit.message == 'Consolidar las ramas de Arcana Arena en main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Retirar las referencias verificadas
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/arcana-ref-cleanup"
          git init -q "$dir"
          cd "$dir"
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          gh auth setup-git
          git fetch --quiet --no-tags --filter=tree:0 origin refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse refs/remotes/origin/main)" = "$GITHUB_SHA"
          git ls-remote --heads origin > "$RUNNER_TEMP/arcana-heads"
          leases=()
          deletes=()
          while read -r expected branch; do
            ref="refs/heads/$branch"
            actual=$(awk -v ref="$ref" '$2 == ref {print $1}' "$RUNNER_TEMP/arcana-heads")
            if [[ -z "$actual" ]]; then continue; fi
            test "$branch" != main
            test "$actual" = "$expected"
            git merge-base --is-ancestor "$expected" "$GITHUB_SHA"
            leases+=("--force-with-lease=$ref:$expected")
            deletes+=(":$ref")
          done <<'VERIFIED_HEADS'
          d994e4914cc2d555721b94d09e4a7de80e6b9b74 dependabot/github_actions/actions/checkout-7.0.1
          8a4a8d334b2d1e3dab19910af188793e7eb471f3 dependabot/github_actions/actions/download-artifact-8.0.2
          17acebb6d7bdcbb9479a920bc8e5f0453e6b51f1 dependabot/github_actions/actions/setup-node-7.1.0
          5341b76681c6fd779f1bbaa5af4bc4040e04c2d4 dependabot/github_actions/actions/upload-artifact-7.0.2
          9971ce7cdd767a3f530ecb1089762b6129d87154 dependabot/gradle/android/firebase-plugin/com.android.library-9.5.2
          8b0391bb0797d4d8ed6189d642602d595c2af2ee dependabot/gradle/android/firebase-plugin/com.google.android.libraries.identity.googleid-googleid-1.2.1
          a00abebfea85c637352f75ce2e534118b9659448 dependabot/gradle/android/firebase-plugin/com.google.firebase-firebase-auth-25.0.0
          299ffc6cb93d9454602e7e7ee49db46081b98705 dependabot/gradle/android/firebase-plugin/org.godotengine-godot-4.7.2.stable
          65214431f13989c75819ad797a084965804a53f5 dependabot/npm_and_yarn/tests/firebase-rules/firebase-13.4.0
          588f6ad6319d4282cc3241960dc08881db217c6d dependabot/npm_and_yarn/tests/firebase-rules/firebase-tools-15.36.0
          ec4e7d1b9a908f6dc28f16e88fe6fcb8fddd033d dependabot/npm_and_yarn/tests/firebase-rules/firebase/rules-unit-testing-6.0.0
          542a155f1b0d213cd7770a4dab52ac32852dfece dependabot/nuget/src/Arcana.Core/System.Security.Cryptography.ProtectedData-11.0.0
          a58b62918e8de9a9b1dcbff951050e26b7ea5612 dependabot/nuget/src/Arcana.Server/FirebaseAdmin-3.7.1
          e000a5502ec7c7113e0127d5c5c9934bc6c200ac dependabot/nuget/src/Arcana.Server/Google.Cloud.Firestore-4.7.0
          85a9eaa3ec41ea98e0235be7119d96a65878db2e pruebas/iconos-cuentas-firebase
          4a347749f984c143a435151725da220ef5fd33e1 pruebas/seguridad-rendimiento-integral
          ae79bdae0d5b7e9121b31f7fd5944fe623ccfec3 pruebas/servidor-generaciones
          VERIFIED_HEADS
          if (( ${#deletes[@]} )); then
            git push --atomic "${leases[@]}" origin "${deletes[@]}"
          fi
          git ls-remote --heads origin
