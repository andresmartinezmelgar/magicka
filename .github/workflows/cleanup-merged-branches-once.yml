name: One-time branch consolidation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-merged-branches-once.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  delete-merged-branches:
    if: github.repository == 'andresmartinezmelgar/magicka'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify all branches have merged PRs, then delete (never main)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          default=$(gh api "repos/$repo" --jq '.default_branch')
          test "$default" = 'main' || { echo "::error::Main no es rama predeterminada"; exit 1; }
          branches=$(gh api --paginate "repos/$repo/branches?per_page=100" --jq '.[].name')
          targets=()
          while IFS= read -r branch; do
            [[ -z "$branch" || "$branch" == 'main' ]] && continue
            case "$branch" in
              codex/firebase-android-tests) pr=2 ;;
              feature/firebase-direct-android-auth) pr=4 ;;
              feature/option-a-unified-menus) pr=9 ;;
              feature/ui-unificada) pr=3 ;;
              fix-release-upload-race) pr=7 ;;
              mobile-profile-firestore-ux-v0176) pr=8 ;;
              mobile-ui-firestore-fix) pr=6 ;;
              updater-progress) pr=5 ;;
              *) echo "::error::Rama inesperada, no se elimina nada: $branch"; exit 1 ;;
            esac
            merged=$(gh api "repos/$repo/pulls/$pr" --jq '.merged')
            [[ "$merged" == 'true' ]] || { echo "::error::PR #$pr sin fusionar ($branch)"; exit 1; }
            merged_sha=$(gh api "repos/$repo/pulls/$pr" --jq '.head.sha')
            actual_sha=$(gh api "repos/$repo/git/ref/heads/$branch" --jq '.object.sha')
            [[ "$actual_sha" == "$merged_sha" ]] || {
              echo "::error::Rama $branch avanzo desde la fusion de PR #$pr; no eliminar ninguna."
              exit 1
            }
            targets+=("$branch")
            echo "VERIFIED: $branch PR #$pr sha $actual_sha"
          done <<< "$branches"
          echo "Verified ${#targets[@]} merged branches; now deleting."
          for branch in "${targets[@]}"; do
            [[ "$branch" != 'main' ]] || exit 1
            gh api --silent -X DELETE "repos/$repo/git/refs/heads/$branch"
            echo "DELETED: $branch"
          done
          remaining=$(gh api --paginate "repos/$repo/branches?per_page=100" --jq '.[].name')
          [[ "$remaining" == 'main' ]] || { echo "::error::Quedan ramas: $remaining"; exit 1; }
          echo "BRANCH_CLEANUP_OK: solo main."
