name: Publicar prueba de equipo mítico solicitada

# Petición expresa del usuario: tag de prueba para probar sprites y laboratorio.
# Solo este archivo, rama y mensaje solicitan la compilación y publicación.
# Se cancelan las revisiones anteriores de esta misma rama.
# Todas las simulaciones liberan sus escenas antes de cerrar Godot.
on:
  push:
    branches: [pruebas/equipo-mitico-articulado]
    paths: [.github/workflows/mythic-preview-request.yml]

permissions:
  contents: read
  actions: write

jobs:
  requested-preview:
    if: github.event.head_commit.message == 'Publicar prueba de equipo mítico 0.29.37'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Compilar, comprobar y publicar tag y paquetes de prueba
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'pruebas/equipo-mitico-articulado'
          test "$(tr -d '\r\n' < VERSION)" = '0.29.37'
          python3 scripts/version-support.py check .
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME" --jq '.object.sha')
          test "$current" = "$GITHUB_SHA"
          for old_run in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=$GITHUB_REF_NAME&per_page=20" \
            --jq ".workflow_runs[] | select(.head_sha != \"$GITHUB_SHA\" and (.status == \"queued\" or .status == \"in_progress\" or .status == \"waiting\")) | .id"); do
            gh run cancel "$old_run" --repo "$GITHUB_REPOSITORY" || true
          done
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f publish_preview=true -f publish_stable=false
          run_id=''
          for attempt in $(seq 1 60); do
            run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=workflow_dispatch&per_page=10" \
              --jq ".workflow_runs[] | select(.head_sha == \"$GITHUB_SHA\" and .head_branch == \"$GITHUB_REF_NAME\") | .id" | head -n1)
            if [ -n "$run_id" ]; then break; fi
            sleep 3
          done
          test -n "$run_id"
          printf 'Compilación solicitada: https://github.com/%s/actions/runs/%s\n' "$GITHUB_REPOSITORY" "$run_id" >> "$GITHUB_STEP_SUMMARY"
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status --interval 20
          build=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.run_number')
          tag="preview-v0.29.37-r$build"
          release="repos/$GITHUB_REPOSITORY/releases/tags/$tag"
          test "$(gh api "$release" --jq '.target_commitish')" = "$GITHUB_SHA"
          test "$(gh api "$release" --jq '.prerelease')" = true
          test "$(gh api "$release" --jq '.draft')" = false
          gh api "$release" --jq '.assets[].name' | grep -Fx 'ArcanaArena-v0.29.37-Android-arm64.apk'
          gh api "$release" --jq '.assets[].name' | grep -Fx 'ArcanaArena-v0.29.37-Windows-x64.zip'
          printf 'Prueba publicada: https://github.com/%s/releases/tag/%s\n' "$GITHUB_REPOSITORY" "$tag" >> "$GITHUB_STEP_SUMMARY"
