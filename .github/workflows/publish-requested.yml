name: Publicacion estable 0.29.36 solicitada

# Petición expresa: integrar los cambios en main y publicar tag e instaladores.
# Solo este mensaje exacto y esta versión activan la publicación solicitada.
# Revisión 3: liberar recursos de Godot antes de cerrar la prueba de ventas.
on:
  push:
    branches: [main, pruebas/supervivencia-escalado-prismas]
    paths: [.github/workflows/publish-requested.yml]

permissions:
  contents: write
  actions: write

jobs:
  validate-survival:
    name: Compilar y comprobar Supervivencia antes de integrar
    if: github.ref == 'refs/heads/pruebas/supervivencia-escalado-prismas' && github.event.head_commit.message == 'Preparar Arcana Arena 0.29.36'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_ROLL_FORWARD: LatestPatch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Validar versión y compilar cliente, servidor y pruebas
        run: |
          python3 scripts/version-support.py check .
          dotnet build ArcanaArena.sln -c Release --nologo
      - name: Ejecutar regresiones de Supervivencia, escalado y portales
        run: dotnet run --project tests/Arcana.Tests/Arcana.Tests.csproj -c Release --no-build -- --defense-only

  publish-requested-version:
    if: github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Publicar Arcana Arena 0.29.36'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Comprobar la versión y activar la publicación estable
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = main
          test "$(tr -d '\r\n' < VERSION)" = '0.29.36'
          python3 scripts/version-support.py check .
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$GITHUB_SHA"
          for previous_run in 41710137962 41710067196; do
            gh run cancel "$previous_run" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || true
          done
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref main -f publish_preview=false -f publish_stable=true
          run_id=''
          for attempt in $(seq 1 60); do
            run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=workflow_dispatch&per_page=10" \
              --jq ".workflow_runs[] | select(.head_sha == \"$GITHUB_SHA\" and .head_branch == \"main\") | .id" | head -n1)
            if [ -n "$run_id" ]; then break; fi
            sleep 3
          done
          test -n "$run_id"
          printf 'ci_run_id=%s\n' "$run_id" >> "$GITHUB_OUTPUT"
          printf 'Compilación y publicación: https://github.com/%s/actions/runs/%s\n' "$GITHUB_REPOSITORY" "$run_id" >> "$GITHUB_STEP_SUMMARY"
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status --interval 20
      - name: Verificar tag, publicación y SHA-256 de APK y paquetes Windows
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=0.29.36
          tag="v$version"
          release="repos/$GITHUB_REPOSITORY/releases/tags/$tag"
          test "$(gh api "$release" --jq '.target_commitish')" = "$GITHUB_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha')" = "$GITHUB_SHA"
          test "$(gh api "$release" --jq '.draft')" = false
          test "$(gh api "$release" --jq '.prerelease')" = false
          mkdir -p "$RUNNER_TEMP/published-release"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern "ArcanaArena-v$version-Android-arm64.apk" \
            --pattern "ArcanaArena-v$version-Windows-x64.zip" \
            --pattern "ArcanaArena-v$version-Windows-x64.rar" \
            --pattern SHA256SUMS.txt --dir "$RUNNER_TEMP/published-release"
          test "$(stat -c %s "$RUNNER_TEMP/published-release/ArcanaArena-v$version-Android-arm64.apk")" -gt 1048576
          test "$(stat -c %s "$RUNNER_TEMP/published-release/ArcanaArena-v$version-Windows-x64.zip")" -gt 1048576
          test "$(stat -c %s "$RUNNER_TEMP/published-release/ArcanaArena-v$version-Windows-x64.rar")" -gt 1048576
          (cd "$RUNNER_TEMP/published-release" && sha256sum --check SHA256SUMS.txt --ignore-missing)
          printf 'Tag, APK, ZIP y RAR publicados; SHA-256 verificados.\n' >> "$GITHUB_STEP_SUMMARY"
