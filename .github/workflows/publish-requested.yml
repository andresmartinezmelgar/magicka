name: Publicacion expresamente solicitada

# Solo se edita este activador cuando el usuario solicita tag e instaladores.
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-requested.yml]

permissions:
  contents: read
  actions: write

jobs:
  publish-requested-version:
    if: github.event.head_commit.message == 'Publicar Arcana Arena 0.29.26'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verificar main y activar la publicacion manual solicitada
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          test "$main_sha" = "$GITHUB_SHA"
          version=$(gh api "repos/$GITHUB_REPOSITORY/contents/VERSION?ref=main" --jq '.content' | base64 --decode | tr -d '\r\n')
          test "$version" = '0.29.26'
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref main -f publish_stable=true -f publish_preview=false
