name: Publicacion de Supervivencia expresamente solicitada

# Activador limitado a la rama y a la petición de tag/APK del usuario.
# Petición de 0.29.33: tag y versión de pruebas, solicitados expresamente por el usuario.
on:
  push:
    branches: [pruebas/supervivencia-procedural-autoguardado]
    paths: [.github/workflows/publish-requested.yml]

permissions:
  contents: read
  actions: write

jobs:
  publish-requested-version:
    if: github.event.head_commit.message == 'Publicar pruebas de Supervivencia 0.29.33'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verificar la rama y activar la publicación de pruebas solicitada
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME" --jq '.object.sha')
          test "$branch_sha" = "$GITHUB_SHA"
          version=$(gh api "repos/$GITHUB_REPOSITORY/contents/VERSION?ref=$GITHUB_SHA" --jq '.content' | base64 --decode | tr -d '\r\n')
          test "$version" = '0.29.33'
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=$GITHUB_REF_NAME&event=workflow_dispatch&per_page=20" \
            --jq ".workflow_runs[] | select(.head_sha != \"$GITHUB_SHA\" and .status != \"completed\") | .id" > "$RUNNER_TEMP/arcana-stale-runs"
          while IFS= read -r stale_run; do
            [ -z "$stale_run" ] || gh run cancel "$stale_run" --repo "$GITHUB_REPOSITORY" || true
          done < "$RUNNER_TEMP/arcana-stale-runs"
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f publish_preview=true -f publish_stable=false
