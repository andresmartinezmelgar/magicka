name: Publicacion estable 0.29.61 solicitada

# Petición expresa: integrar los cambios en main y publicar tag e instaladores.
# Solo este mensaje exacto y esta versión activan la publicación solicitada.
# Incluye todas las ramas actuales y las elimina solo tras verificar la publicación.
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-requested.yml]

permissions:
  contents: write
  actions: write

jobs:
  publish-requested-version:
    if: github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Publicar Arcana Arena 0.29.61'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Comprobar la versión y activar la publicación estable
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = main
          test "$(tr -d '\r\n' < VERSION)" = '0.29.61'
          python3 scripts/version-support.py check .
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$GITHUB_SHA"
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref main -f publish_preview=false -f publish_stable=true
          run_id=''
          for attempt in $(seq 1 60); do
            run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=workflow_dispatch&per_page=10" \
              --jq ".workflow_runs[] | select(.head_sha == \"$GITHUB_SHA\" and .head_branch == \"main\") | .id" | head -n1)
            if [ -n "$run_id" ]; then break; fi
            sleep 3
          done
          test -n "$run_id"
          printf 'ci_run_id=%s\n' "$run_id" >> "$GITHUB_OUTPUT"
          printf 'Compilación y publicación: https://github.com/%s/actions/runs/%s\n' "$GITHUB_REPOSITORY" "$run_id" >> "$GITHUB_STEP_SUMMARY"
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status --interval 20
      - name: Verificar tag, publicación y SHA-256 de APK y paquetes Windows
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=0.29.61
          tag="v$version"
          release="repos/$GITHUB_REPOSITORY/releases/tags/$tag"
          test "$(gh api "$release" --jq '.target_commitish')" = "$GITHUB_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha')" = "$GITHUB_SHA"
          test "$(gh api "$release" --jq '.draft')" = false
          test "$(gh api "$release" --jq '.prerelease')" = false
          mkdir -p "$RUNNER_TEMP/published-release"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern "ArcanaArena-v$version-Android-arm64.apk" \
            --pattern "ArcanaArena-v$version-Windows-x64.zip" \
            --pattern "ArcanaArena-v$version-Windows-x64.rar" \
            --pattern SHA256SUMS.txt --dir "$RUNNER_TEMP/published-release"
          test "$(stat -c %s "$RUNNER_TEMP/published-release/ArcanaArena-v$version-Android-arm64.apk")" -gt 1048576
          test "$(stat -c %s "$RUNNER_TEMP/published-release/ArcanaArena-v$version-Windows-x64.zip")" -gt 1048576
          test "$(stat -c %s "$RUNNER_TEMP/published-release/ArcanaArena-v$version-Windows-x64.rar")" -gt 1048576
          (cd "$RUNNER_TEMP/published-release" && sha256sum --check SHA256SUMS.txt --ignore-missing)
          printf 'Tag, APK, ZIP y RAR publicados; SHA-256 verificados.\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Eliminar las ramas verificadas e integradas en main
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const main = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
            if (main.data.commit.sha !== context.sha) {
              throw new Error('main ha avanzado; se conservan las ramas para revisar la nueva integración.');
            }
            const branches = [
              { name: 'pruebas/dashboard-estadisticas', sha: '9cffe80c691903526646ebecd7edf50890a59268' },
              { name: 'pruebas/dashboard-publico-red-avisos', sha: '99c3fafe4a525eafea183b0252ad2d1a6f5b9d88' },
              { name: 'pruebas/mejoras-supervivencia', sha: '1fdec204d0fb226d3857c2e773ef5d8a155216be' },
              { name: 'pruebas/prioridades-sin-duplicados', sha: 'cd9d0e993be6b13c6e36618ef3d8ccec43fdd5c5' },
              { name: 'pruebas/reducir-trafico-pvp', sha: 'e1652c9daab40c1833eb56a21c9cf7479862349e' }
            ];
            // Comprobar todas las ramas antes de empezar a borrar cualquiera.
            const integrated = [];
            for (const branch of branches) {
              let current;
              try { current = await github.rest.repos.getBranch({ owner, repo, branch: branch.name }); }
              catch (error) { if (error.status === 404) continue; throw error; }
              if (current.data.commit.sha !== branch.sha) {
                throw new Error('La rama ha avanzado y se conserva: ' + branch.name);
              }
              const comparison = await github.rest.repos.compareCommits({
                owner, repo, base: branch.sha, head: context.sha
              });
              if (!['ahead', 'identical'].includes(comparison.data.status) ||
                  comparison.data.merge_base_commit.sha !== branch.sha) {
                throw new Error('La rama tiene cambios sin integrar y se conserva: ' + branch.name);
              }
              integrated.push(branch);
            }
            for (const branch of integrated) {
              // Releer la referencia inmediatamente antes de eliminarla.
              const current = await github.rest.repos.getBranch({ owner, repo, branch: branch.name });
              if (current.data.commit.sha !== branch.sha) {
                throw new Error('La rama ha avanzado y se conserva: ' + branch.name);
              }
              await github.rest.git.deleteRef({ owner, repo, ref: 'heads/' + branch.name });
              core.info('Rama integrada eliminada: ' + branch.name);
            }
