name: Consolidar ramas una sola vez

on:
  push:
    branches: [main]
    paths: [.github/workflows/consolidate-branches-once.yml]

permissions:
  contents: write

concurrency:
  group: consolidate-branches-once
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.repository == 'andresmartinezmelgar/magicka' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verificar integración y borrar únicamente las ramas autorizadas
        env:
          EXPECTED_BRANCHES: >-
            {"feature/automatic-updates-20261015":"89bf090680290a0d8c8461e3b59d6053b7f2557f","feature/responsive-ui-item-stats-help-20261014":"cfab7f48765c4b6114da46c7823cf7640d568564","feature/stone-element-auras-20261015":"878f2d40bef4238589677fca003b80c44e8d3a4c","feature/stone-element-sprites-20261015":"974a1701a80c9fed21f21b001f3536490c898d77","feature/table-borders-active-bonuses-20261015":"4593fb975801979c228aaa733fbb8441a8983414","feature/touch-scroll-all-screens-20261015":"1b0e53c10da4789a41a38ad5971fa6346b151bb8","fix/lan-series-rewards-ui-20261014":"f8ca0fea6abc5ad301e0f95862e745488ab972c6","fix/update-choice-first-attempt-20261015":"003ad39ee5eb5dc4c74e190cb5ba4846d9a33bf7","improvements/responsive-qa-performance-20261013":"6335a860ab21287530bef008b466d070f78837c6"}
          EXPECTED_SOURCE_TREE: 177977e00b5bca6c6559e8f74199b994b8bb35cb
        shell: python
        run: |
          import json
          import os
          import subprocess

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          def heads():
              return {
                  ref.removeprefix("refs/heads/"): sha
                  for sha, ref in (
                      line.split("\t", 1)
                      for line in git("ls-remote", "--heads", "origin").splitlines()
                  )
              }

          expected = json.loads(os.environ["EXPECTED_BRANCHES"])
          current = heads()
          if git("rev-parse", "HEAD") != os.environ["GITHUB_SHA"]:
              raise RuntimeError("El checkout no coincide con el commit que activó la tarea.")
          if current.get("main") != os.environ["GITHUB_SHA"]:
              raise RuntimeError("main ha cambiado; se conserva todo para revisar la nueva versión.")
          if set(current) != set(expected) | {"main"}:
              raise RuntimeError("La lista de ramas ha cambiado; no se borrará ninguna.")
          changed = git(
              "diff", "--name-only", os.environ["EXPECTED_SOURCE_TREE"], "HEAD"
          ).splitlines()
          if changed != [".github/workflows/consolidate-branches-once.yml"]:
              raise RuntimeError("La consolidación ha cambiado archivos del juego inesperadamente.")
          for branch, sha in expected.items():
              if current[branch] != sha:
                  raise RuntimeError("La rama ha recibido cambios: " + branch)
              subprocess.run(
                  ["git", "merge-base", "--is-ancestor", sha, "HEAD"], check=True
              )

          tags_before = git("ls-remote", "--tags", "origin")
          command = ["git", "push", "--atomic", "--porcelain"]
          command.extend(
              "--force-with-lease=refs/heads/" + branch + ":" + sha
              for branch, sha in expected.items()
          )
          command.append("origin")
          command.extend(":refs/heads/" + branch for branch in expected)
          subprocess.run(command, check=True)
          if heads() != {"main": os.environ["GITHUB_SHA"]}:
              raise RuntimeError("La verificación final de ramas no coincide con lo esperado.")
          if git("ls-remote", "--tags", "origin") != tags_before:
              raise RuntimeError("Las etiquetas han cambiado durante la operación.")
          print("BRANCH_CONSOLIDATION_OK: main conserva los commits de las " + str(len(expected)) + " ramas eliminadas.")
