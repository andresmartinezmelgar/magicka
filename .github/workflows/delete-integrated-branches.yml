name: Eliminar rama ya integrada

on:
  push:
    branches: [main]
    paths: ['.github/workflows/delete-integrated-branches.yml']

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verificar integración y eliminar con protección frente a cambios
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main' '+refs/heads/codex/visual-performance:refs/remotes/origin/codex/visual-performance'
          integrated_branch_sha=90515f2a1755c082638e6af15107b7cda00cb861
          test "$(git rev-parse refs/remotes/origin/codex/visual-performance)" = "$integrated_branch_sha"
          git merge-base --is-ancestor "$integrated_branch_sha" refs/remotes/origin/main
          git push --force-with-lease="refs/heads/codex/visual-performance:$integrated_branch_sha" origin :refs/heads/codex/visual-performance
          git ls-remote --heads origin
