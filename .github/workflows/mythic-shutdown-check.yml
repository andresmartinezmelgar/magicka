name: Diagnosticar cierre de Godot

on:
  push:
    branches: [pruebas/equipo-mitico-articulado]
    paths: [.github/workflows/mythic-shutdown-check.yml]

permissions:
  contents: read

jobs:
  shutdown:
    if: github.event.head_commit.message == 'Diagnosticar cierre de Godot'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DOTNET_ROLL_FORWARD: LatestPatch
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Preparar Godot y compilar el cliente
        run: |
          set -euo pipefail
          curl --retry 4 --retry-delay 2 -fL https://github.com/godotengine/godot/releases/download/4.5.2-stable/Godot_v4.5.2-stable_mono_linux_x86_64.zip -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          GODOT="$RUNNER_TEMP/godot/Godot_v4.5.2-stable_mono_linux_x86_64/Godot_v4.5.2-stable_mono_linux.x86_64"
          chmod +x "$GODOT"
          echo "ARCANA_GODOT=$GODOT" >> "$GITHUB_ENV"
          dotnet build src/Arcana.Client/Arcana.Client.csproj -c Debug --nologo
          "$GODOT" --headless --editor --path src/Arcana.Client --import
      - name: Examinar el cierre con recursos e instancias detallados
        run: |
          set -euo pipefail
          export XDG_DATA_HOME="$RUNNER_TEMP/shutdown-cache"
          xvfb-run -a -s '-screen 0 1440x1024x24' timeout --kill-after=10s 180s "$ARCANA_GODOT" --verbose --audio-driver Dummy --path src/Arcana.Client -- --survival-biomes-smoke --mobile --smoke-viewport=720x540 2>&1 | tee "$RUNNER_TEMP/shutdown.log"
          grep -q 'SURVIVAL_BIOMES_SMOKE_OK: 10' "$RUNNER_TEMP/shutdown.log"
          ! grep -E '^(ERROR:|SCRIPT ERROR:)|SMOKE_FAILED|ObjectDB instances leaked' "$RUNNER_TEMP/shutdown.log"
