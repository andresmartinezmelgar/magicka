name: Diagnosticar cierre de Godot

on:
  push:
    branches: [pruebas/equipo-mitico-articulado]
    paths: [.github/workflows/mythic-shutdown-check.yml]

permissions:
  contents: read

jobs:
  shutdown:
    if: github.event.head_commit.message == 'Diagnosticar cierre de Godot'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DOTNET_ROLL_FORWARD: LatestPatch
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Preparar Godot y compilar el cliente
        run: |
          set -euo pipefail
          curl --retry 4 --retry-delay 2 -fL https://github.com/godotengine/godot/releases/download/4.5.2-stable/Godot_v4.5.2-stable_mono_linux_x86_64.zip -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          GODOT="$RUNNER_TEMP/godot/Godot_v4.5.2-stable_mono_linux_x86_64/Godot_v4.5.2-stable_mono_linux.x86_64"
          chmod +x "$GODOT"
          echo "ARCANA_GODOT=$GODOT" >> "$GITHUB_ENV"
          dotnet build src/Arcana.Client/Arcana.Client.csproj -c Debug --nologo
          "$GODOT" --headless --editor --path src/Arcana.Client --import
      - name: Repetir el cierre normal en escritorio y móvil
        run: |
          set -euo pipefail
          for pass in 1 2 3; do
            for surface in desktop mobile; do
              args=(); viewport=1280x720
              if [ "$surface" = mobile ]; then args+=(--mobile); viewport=720x540; fi
              export XDG_DATA_HOME="$RUNNER_TEMP/shutdown-$surface-$pass"
              log="$RUNNER_TEMP/shutdown-$surface-$pass.log"
              xvfb-run -a -s '-screen 0 1440x1024x24' timeout --kill-after=10s 180s "$ARCANA_GODOT" --audio-driver Dummy --path src/Arcana.Client -- --survival-biomes-smoke "${args[@]}" "--smoke-viewport=$viewport" 2>&1 | tee "$log"
              grep -q 'SURVIVAL_BIOMES_SMOKE_OK: 10' "$log"
              if grep -E '^(ERROR:|SCRIPT ERROR:)|SMOKE_FAILED|ObjectDB instances leaked' "$log"; then
                xvfb-run -a -s '-screen 0 1440x1024x24' timeout --kill-after=10s 180s "$ARCANA_GODOT" --verbose --audio-driver Dummy --path src/Arcana.Client -- --survival-biomes-smoke "${args[@]}" "--smoke-viewport=$viewport"
                exit 1
              fi
              echo "SHUTDOWN_CHECK_OK: $surface $pass"
            done
          done
